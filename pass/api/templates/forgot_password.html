{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4 shadow-sm border-0" style="background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 16px;">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle mb-3" style="width: 64px; height: 64px; font-size: 28px;">
          <i class="fa-solid fa-key text-warning"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Forgot Password</h3>
        <p class="text-muted small mb-0">
          Enter your registered username or email address and we'll send you a one-time code to log in or reset your password.
        </p>
      </div>

      <form method="POST" action="{{ url_for('forgot_password') }}" autocomplete="off">
        <div class="mb-4">
          <label class="form-label fw-semibold text-secondary">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
            <input 
              type="text" 
              name="identity" 
              class="form-control border-start-0" 
              placeholder="e.g. johndoe or john@example.com" 
              value="{{ identity or '' }}" 
              required 
              autofocus
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 shadow-sm" style="border-radius: 10px; font-weight: 600;">
          <i class="fa-solid fa-paper-plane me-2"></i> Send One-Time Code
        </button>

        <div class="text-center pt-2">
          <a href="{{ url_for('login') }}" class="text-muted text-decoration-none small">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
          </a>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}
