{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card p-4 shadow-sm border-0" style="background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 16px;">
      
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-info-subtle text-info rounded-circle mb-3" style="width: 64px; height: 64px; font-size: 28px;">
          <i class="fa-solid fa-shield-halved text-primary"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">One-Time Security Code</h3>
        <p class="text-muted small mb-0">
          We sent a 6-digit code to <strong class="text-primary">{{ masked_email or email }}</strong>
        </p>
      </div>

      <!-- Nav Tabs to choose between One-Time Login and Update Password -->
      <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-3" id="recoveryTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-semibold" id="onetime-tab" data-bs-toggle="pill" data-bs-target="#onetime-panel" type="button" role="tab">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Log In Directly
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-semibold" id="reset-tab" data-bs-toggle="pill" data-bs-target="#reset-panel" type="button" role="tab">
            <i class="fa-solid fa-key me-1"></i> Reset Password
          </button>
        </li>
      </ul>

      <div class="tab-content" id="recoveryTabsContent">
        
        <!-- OPTION 1: One-Time Login -->
        <div class="tab-pane fade show active" id="onetime-panel" role="tabpanel">
          <form method="POST" action="{{ url_for('verify_forgot_password_otp') }}">
            <input type="hidden" name="action_type" value="onetime_login">
            
            <div class="mb-4">
              <label class="form-label text-center d-block fw-semibold text-muted small text-uppercase" style="letter-spacing: 1px;">Enter 6-Digit One-Time Code</label>
              <div class="d-flex justify-content-center">
                <input 
                  type="text" 
                  name="otp_code" 
                  maxlength="6" 
                  pattern="\d{6}"
                  inputmode="numeric"
                  required 
                  placeholder="••••••" 
                  class="form-control form-control-lg text-center fw-bold"
                  style="font-size: 32px; letter-spacing: 10px; max-width: 260px; font-family: monospace; border-radius: 12px; border: 2px solid #93c5fd;"
                  autofocus
                />
              </div>
              <div class="form-text text-center mt-2 small text-muted">
                Allows direct single-session access without changing your password.
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 shadow-sm" style="border-radius: 10px; font-weight: 600;">
              <i class="fa-solid fa-unlock-keyhole me-2"></i> Log In With One-Time Code
            </button>
          </form>
        </div>

        <!-- OPTION 2: Reset / Update Master Password -->
        <div class="tab-pane fade" id="reset-panel" role="tabpanel">
          <form method="POST" action="{{ url_for('verify_forgot_password_otp') }}">
            <input type="hidden" name="action_type" value="reset_password">

            <div class="mb-3">
              <label class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 1px;">6-Digit One-Time Code</label>
              <input 
                type="text" 
                name="otp_code" 
                maxlength="6" 
                pattern="\d{6}"
                inputmode="numeric"
                required 
                placeholder="••••••" 
                class="form-control form-control-lg text-center fw-bold"
                style="font-size: 24px; letter-spacing: 6px; font-family: monospace; border-radius: 10px;"
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold text-secondary">New Master Password</label>
              <div class="input-group">
                <input 
                  type="password" 
                  name="new_password" 
                  id="new_pw_input"
                  class="form-control" 
                  placeholder="Enter new strong master password" 
                  required 
                />
                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('new_pw_input', 'eye_icon_1')">
                  <i class="fa-solid fa-eye" id="eye_icon_1"></i>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold text-secondary">Confirm New Password</label>
              <div class="input-group">
                <input 
                  type="password" 
                  name="confirm_password" 
                  id="confirm_pw_input"
                  class="form-control" 
                  placeholder="Re-enter new master password" 
                  required 
                />
                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirm_pw_input', 'eye_icon_2')">
                  <i class="fa-solid fa-eye" id="eye_icon_2"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 mb-3 shadow-sm" style="border-radius: 10px; font-weight: 600;">
              <i class="fa-solid fa-floppy-disk me-2"></i> Update Password & Log In
            </button>
          </form>
        </div>

      </div>

      <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-2">
        <a href="{{ url_for('forgot_password') }}" class="text-muted text-decoration-none small">
          <i class="fa-solid fa-arrow-left me-1"></i> Try Different Email
        </a>

        <form method="POST" action="{{ url_for('resend_forgot_password_otp') }}" class="d-inline">
          <button type="submit" class="btn btn-link p-0 text-decoration-none small text-primary fw-semibold">
            <i class="fa-solid fa-rotate-right me-1"></i> Resend Code
          </button>
        </form>
      </div>

    </div>
  </div>
</div>

<script>
function togglePasswordVisibility(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  if (!input || !icon) return;
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}
</script>
{% endblock %}
